services:
  app:
    build: .
    container_name: galgame-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://galgame:${POSTGRES_PASSWORD:-galgame_password}@postgres:5432/galgame
      UPLOAD_DIR: /app/uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_PRO_LIFETIME: ${STRIPE_PRICE_PRO_LIFETIME:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: galgame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: galgame
      POSTGRES_USER: galgame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galgame_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galgame -d galgame"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  uploads:
